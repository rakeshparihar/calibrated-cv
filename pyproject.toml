[project]
name = "calibrated-cv"
version = "0.1.0"
description = "A product-image classifier API whose confidence can be trusted: temperature scaling, conformal prediction sets, abstention and slice-based evaluation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "datasets>=2.20",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "numpy>=1.26",
  "pillow>=10",
  "sentencepiece>=0.2",
  "protobuf>=4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
